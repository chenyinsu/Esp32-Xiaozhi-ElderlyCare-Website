spring:
  security:
    user:
      name: admin
      password: admin123
  application:
    name: esp32-robot
  jpa:
    hibernate:
      ddl-auto: update  # 开发环境自动创建表
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: jdbc:mysql://localhost:3306/esp32_robot?useSSL=false&serverTimezone=UTC&characterEncoding=utf8mb4
    username: root
    password: 123000  # 改成你的密码
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.example.esp32robot: DEBUG