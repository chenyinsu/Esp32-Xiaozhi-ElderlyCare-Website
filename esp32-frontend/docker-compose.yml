version: '3.8'

services:
  # 前端服务
  frontend:
    build: .
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - esp32-network
    restart: unless-stopped

  # 后端服务
  backend:
    build: ../esp32-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql:db:3306/esp32_robot_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    depends_on:
      - mysql
    networks:
      - esp32-network
    restart: unless-stopped

  # MySQL数据库
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=esp32_robot_db
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - esp32-network
    restart: unless-stopped

  # Nginx代理（可选）
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - esp32-network
    restart: unless-stopped

networks:
  esp32-network:
    driver: bridge

volumes:
  mysql-data: